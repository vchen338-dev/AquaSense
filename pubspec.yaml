name: ammoniasense
description: AmmoniaSense - smart water monitoring for your fish, powered by an ESP32 sensor box.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  intl: ">=0.19.0 <1.0.0"
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1F8FD0"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
